# Android embedding verify: assembles the android/ AAR subproject on the same
# self-hosted linux runner as dex-verify.yml (dsh-jvm-1). Zero local-gradle
# policy for the feature lanes — CI is the verifier, so this workflow is the
# gate that keeps android/ compiling against AGP + the pinned deps.
# Modeled on dex-verify.yml: workflow-level toolchain env, scoped daemon
# cleanup, non-fatal artifact uploads, and the chmod +x ./gradlew lesson.
name: android-verify

on:
  workflow_dispatch:
  push:
    branches: [windows-verify, linux-verify]

# Machine-specific toolchain locations for the self-hosted Linux runner.
# Kept at workflow level so the machine owner edits ONE place here.
# AGP 8.5.x requires the Gradle daemon to run on JDK 17 — hence temurin-17,
# while the Kotlin toolchain (jvmTarget 11) is satisfied by the compile.
env:
  JAVA_HOME: /home/dingyi/.jdks/temurin-17
  ANDROID_HOME: /home/dingyi/Android/Sdk

jobs:
  android-assemble:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          git rev-parse --short HEAD

      # ANDROID_HOME is pre-set on the runner; sdkmanager may or may not be on
      # PATH depending on the cmdline-tools layout — warn, never fail here.
      # Missing android-34 platform/build-tools are auto-installed by AGP iff
      # SDK licenses are already accepted on this machine.
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          if [ ! -x "$SDKM" ] && [ -x "$ANDROID_HOME/tools/bin/sdkmanager" ]; then SDKM="$ANDROID_HOME/tools/bin/sdkmanager"; fi
          if [ -x "$SDKM" ]; then
            "$SDKM" --version
            # Accept all licenses + pre-install exactly what the build needs, so
            # AGP never trips on "licences have not been accepted" mid-compile.
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-34" "build-tools;35.0.0" > /dev/null 2>&1 ||               echo "WARN: sdkmanager install failed — relying on pre-installed components"
          else
            echo "WARN: sdkmanager not found (relying on pre-installed platforms/build-tools)"
          fi
          if [ -d "$ANDROID_HOME/platforms" ]; then
            ls "$ANDROID_HOME/platforms" | sed 's/^/platform: /'
          else
            echo "WARN: no platforms directory under ANDROID_HOME"
          fi

      # assembleRelease needs NO signing config for a library (AARs are never
      # signed). Builds only :android to keep the run scoped and fast.
      - name: Assemble android AAR and fat jar
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          chmod +x ./gradlew
          ./gradlew :android:assembleRelease :android:androidReleaseJar --parallel

      # Also builds the sample app (includes sample app APK, android/sample).
      # Activates when the sample-app lane lands: :android:sample is not yet in
      # settings.gradle.kts, so this step fails (intentionally, no always-pass
      # guard) until that lane adds android/sample/build.gradle.kts + the
      # settings include. Kept plain so it is a real gate, not a no-op.
      - name: Assemble sample app (includes sample app)
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          chmod +x ./gradlew
          ./gradlew :android:sample:assembleDebug --parallel

      - name: Stop Gradle daemons
        if: always()
        # Scoped cleanup: `gradlew --stop` stops only the daemons registered
        # under this Gradle user home/version. Never a blanket java kill on a
        # shared self-hosted runner.
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          ./gradlew --stop || true

      - name: Upload release AAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aar
          path: android/build/outputs/aar/*.aar
          if-no-files-found: warn

      # Fat classes jar for consumers running their own dex step (the
      # monaco-lsp-demo classes.dex pipeline). Non-fatal: the AAR above is the
      # recommended artifact.
      - name: Upload fat classes jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-fat-jar
          path: android/build/libs/*.jar
          if-no-files-found: warn
