# Windows self-hosted slice runner (progress-bar mode).
# One small --tests group per run. Does NOT run full jvmTest.
# Progress: tasks/agent-runs/win-slices/progress.json
name: windows-jvmtest

on:
  workflow_dispatch:
    inputs:
      slice:
        description: 'Slice id from slices.json (empty = next non-success)'
        required: false
        default: ''
  push:
    branches: [windows-verify]

jobs:
  jvm-slice:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    env:
      JAVA_HOME: C:\Users\dingyi\.jdks\temurin-17.0.11
      ANDROID_HOME: C:\Users\dingyi\AppData\Local\Android\Sdk
      GRADLE_OPTS: -Dorg.gradle.workers.max=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        shell: pwsh
        run: |
          $env:Path = "$env:JAVA_HOME\bin;$env:Path"
          Write-Host "JAVA_HOME=$env:JAVA_HOME"
          & "$env:JAVA_HOME\bin\java.exe" -version
          Write-Host "processor_count=$env:NUMBER_OF_PROCESSORS"
          git rev-parse --short HEAD
          Write-Host "mode=slice-progress cpu_hard_cap=affinity_0x3F workers=5"
          if (Test-Path tasks/agent-runs/win-slices/progress.json) {
            Get-Content tasks/agent-runs/win-slices/progress.json | Select-Object -First 40
          }

      - name: Compile test sources (CPU hard-capped)
        shell: pwsh
        run: |
          $env:Path = "$env:JAVA_HOME\bin;$env:Path"
          ./scripts/windows-run-gradle-capped.ps1 compileTestKotlinJvm --parallel --max-workers=5

      - name: Run next test slice (CPU hard-capped)
        shell: pwsh
        env:
          SLICE_INPUT: ${{ github.event.inputs.slice }}
        run: |
          $env:Path = "$env:JAVA_HOME\bin;$env:Path"
          $slice = $env:SLICE_INPUT
          if ([string]::IsNullOrWhiteSpace($slice)) {
            ./scripts/windows-run-slice.ps1
          } else {
            ./scripts/windows-run-slice.ps1 -Slice $slice
          }

      - name: Stop Gradle and kill leftover Java
        if: always()
        shell: cmd
        run: |
          set "PATH=%JAVA_HOME%\bin;%PATH%"
          call gradlew.bat --stop
          taskkill /F /IM java.exe 2>nul
          taskkill /F /IM javaw.exe 2>nul
          exit /b 0

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-xml
          path: build/test-results/jvmTest/**
          if-no-files-found: warn

      - name: Upload slice progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slice-progress
          path: |
            slice-result.json
            slice-progress.json
            tasks/agent-runs/win-slices/progress.json
            tasks/agent-runs/win-slices/results/**
          if-no-files-found: warn

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-html
          path: build/reports/tests/jvmTest/**
          if-no-files-found: warn
