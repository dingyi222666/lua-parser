# Windows self-hosted runner only. Does not run on main.
# Runner labels: self-hosted, Windows, X64 (DINGYI-PC)
# CPU HARD CAP (real, not soft):
#   scripts/windows-run-gradle-capped.ps1
#   - ProcessorAffinity 0x3F = 6 of 8 cores (~75-80%)
#   - BelowNormal priority on cmd/gradle + all java/javaw children
# Soft Gradle caps: workers.max=5, maxParallelForks=5, --max-workers=5
name: windows-jvmtest

on:
  workflow_dispatch:
  push:
    branches: [windows-verify]

jobs:
  jvm-test:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240
    env:
      JAVA_HOME: C:\Users\dingyi\.jdks\temurin-17.0.11
      ANDROID_HOME: C:\Users\dingyi\AppData\Local\Android\Sdk
      GRADLE_OPTS: -Dorg.gradle.workers.max=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        shell: pwsh
        run: |
          Write-Host "JAVA_HOME=$env:JAVA_HOME"
          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
          java -version
          Write-Host "processor_count=$env:NUMBER_OF_PROCESSORS"
          git rev-parse --short HEAD
          Write-Host "cpu_hard_cap=ProcessorAffinity_0x3F_6of8 + BelowNormal + workers=5"

      - name: Compile test sources (CPU hard-capped)
        shell: pwsh
        run: ./scripts/windows-run-gradle-capped.ps1 compileTestKotlinJvm --parallel --max-workers=5

      - name: Full jvmTest (CPU hard-capped)
        shell: pwsh
        run: ./scripts/windows-run-gradle-capped.ps1 jvmTest --parallel --max-workers=5

      - name: Stop Gradle and kill leftover Java
        if: always()
        shell: cmd
        run: |
          call gradlew.bat --stop
          taskkill /F /IM java.exe 2>nul
          taskkill /F /IM javaw.exe 2>nul
          exit /b 0

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-xml
          path: build/test-results/jvmTest/**
          if-no-files-found: warn

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-html
          path: build/reports/tests/jvmTest/**
          if-no-files-found: warn
