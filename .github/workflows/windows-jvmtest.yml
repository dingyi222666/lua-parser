# Windows self-hosted runner only. Does not run on main.
# Runner labels: self-hosted, Windows, X64 (DINGYI-PC)
# Parallelism: ~80% of 8-core host → workers.max=6, maxParallelForks=6, Xmx4G
name: windows-jvmtest

on:
  workflow_dispatch:
  push:
    branches: [windows-verify]

jobs:
  jvm-test:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240
    env:
      JAVA_HOME: C:\Users\dingyi\.jdks\temurin-17.0.11
      ANDROID_HOME: C:\Users\dingyi\AppData\Local\Android\Sdk
      GRADLE_OPTS: -Dorg.gradle.workers.max=6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        shell: cmd
        run: |
          echo JAVA_HOME=%JAVA_HOME%
          echo ANDROID_HOME=%ANDROID_HOME%
          java -version
          echo processor_count=%NUMBER_OF_PROCESSORS%
          git rev-parse --short HEAD

      - name: Compile test sources
        shell: cmd
        run: gradlew.bat compileTestKotlinJvm --parallel --max-workers=6

      - name: Full jvmTest
        shell: cmd
        run: gradlew.bat jvmTest --parallel --max-workers=6

      - name: Stop Gradle and kill leftover Java
        if: always()
        shell: cmd
        run: |
          call gradlew.bat --stop
          taskkill /F /IM java.exe 2>nul
          taskkill /F /IM javaw.exe 2>nul
          exit /b 0

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-xml
          path: build/test-results/jvmTest/**
          if-no-files-found: warn

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-html
          path: build/reports/tests/jvmTest/**
          if-no-files-found: warn
