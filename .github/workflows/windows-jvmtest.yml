# Windows self-hosted slice runner (progress-bar mode).
# One small --tests group per run. Does NOT run full jvmTest.
# GATE: must-green-to-advance — red slice blocks next until fixed.
# Progress: tasks/agent-runs/win-slices/progress.json
name: windows-jvmtest

on:
  workflow_dispatch:
    inputs:
      slice:
        description: 'Slice id from slices.json (empty = next non-success)'
        required: false
        default: ''
  push:
    branches: [windows-verify]

# Machine-specific toolchain locations for the self-hosted Windows runner.
# Kept at workflow level so the machine owner edits ONE place here instead of
# hunting through job/step blocks. Same values the job-level env used before.
env:
  JAVA_HOME: C:\Users\dingyi\.jdks\temurin-17.0.11
  ANDROID_HOME: C:\Users\dingyi\AppData\Local\Android\Sdk

jobs:
  jvm-slice:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.workers.max=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        shell: pwsh
        run: |
          $env:Path = "$env:JAVA_HOME\bin;$env:Path"
          Write-Host "JAVA_HOME=$env:JAVA_HOME"
          & "$env:JAVA_HOME\bin\java.exe" -version
          Write-Host "processor_count=$env:NUMBER_OF_PROCESSORS"
          git rev-parse --short HEAD
          Write-Host "mode=slice-progress cpu_hard_cap=affinity_0x3F workers=5"
          if (Test-Path tasks/agent-runs/win-slices/progress.json) {
            Get-Content tasks/agent-runs/win-slices/progress.json | Select-Object -First 40
          }

      # Arm reflective Android soft-skips when host SDK platform jar is missing.
      - name: Ensure android.jar (platforms/android-35)
        shell: pwsh
        run: |
          $env:Path = "$env:JAVA_HOME\bin;$env:Path"
          ./scripts/windows-ensure-android-jar.ps1

      - name: Compile test sources (CPU hard-capped)
        shell: pwsh
        run: |
          $env:Path = "$env:JAVA_HOME\bin;$env:Path"
          ./scripts/windows-run-gradle-capped.ps1 compileTestKotlinJvm --parallel --max-workers=5

      - name: Run next test slice (CPU hard-capped)
        shell: pwsh
        env:
          SLICE_INPUT: ${{ github.event.inputs.slice }}
        run: |
          $env:Path = "$env:JAVA_HOME\bin;$env:Path"
          $slice = $env:SLICE_INPUT
          if ([string]::IsNullOrWhiteSpace($slice)) {
            ./scripts/windows-run-slice.ps1
          } else {
            ./scripts/windows-run-slice.ps1 -Slice $slice
          }

      - name: Stop Gradle daemons
        if: always()
        shell: cmd
        # Cleanup is deliberately scoped: `gradlew --stop` stops only the Gradle
        # daemons registered under this Gradle user home/version. Do NOT add a
        # blanket `taskkill /F /IM java.exe` here — on a shared self-hosted runner
        # that kills every Java process machine-wide (IDEs, other runs' daemons,
        # Kotlin compile daemons of concurrent jobs). Orphaned Kotlin compile
        # daemons exit with the Gradle daemon or time out on their own.
        run: |
          set "PATH=%JAVA_HOME%\bin;%PATH%"
          call gradlew.bat --stop
          exit /b 0

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-xml
          path: build/test-results/jvmTest/**
          if-no-files-found: warn

      - name: Upload slice progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slice-progress
          path: |
            slice-result.json
            slice-progress.json
            tasks/agent-runs/win-slices/progress.json
            tasks/agent-runs/win-slices/results/**
          if-no-files-found: warn

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-html
          path: build/reports/tests/jvmTest/**
          if-no-files-found: warn
